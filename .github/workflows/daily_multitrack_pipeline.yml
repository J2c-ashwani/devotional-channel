name: Itihasa Saga Daily Autonomous Pipeline

on:
  schedule:
    # 🌅 Morning Slot (Ramayana): Runs at 00:45 UTC = 6:15 AM IST (Publishes for 7:00 AM IST)
    - cron: '45 0 * * *'
    # ⚔️ Evening Slot (Mahabharata): Runs at 12:15 UTC = 5:45 PM IST (Publishes for 6:30 PM IST)
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      track:
        description: 'Epic Track to Produce'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - RAMAYANA
          - MAHABHARATA

permissions:
  contents: write

jobs:
  produce_and_publish_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-lohit-deva fontconfig
          fc-cache -fv >/dev/null 2>&1 || true

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Google Service Account
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > service-account.json
          else
            echo "::error::Missing GCP_SA_KEY secret! Vertex Text-to-Video and GCS require a valid service account."
            exit 1
          fi

      - name: Determine Track (Morning = Ramayana, Evening = Mahabharata)
        id: determine_track
        run: |
          if [ "${{ github.event.inputs.track }}" != "" ] && [ "${{ github.event.inputs.track }}" != "AUTO" ]; then
            echo "TRACK=${{ github.event.inputs.track }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            # Before 11:00 UTC (16:30 IST) handles Morning 00:45 UTC (even under heavy GitHub cron delay) -> RAMAYANA
            if [ "$HOUR" -lt 11 ]; then
              echo "TRACK=RAMAYANA" >> $GITHUB_ENV
            else
              echo "TRACK=MAHABHARATA" >> $GITHUB_ENV
            fi
          fi

      - name: Execute Autonomous Video Production & Multi-Platform Upload
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: devotional-youtube-514907
          GOOGLE_CLOUD_LOCATION: global
          VIDEO_GEN_PROVIDER: vertex_omni_t2v
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UC7jhh-MuUL4GYndzjouOYSQ
          META_PERMANENT_ACCESS_TOKEN: ${{ secrets.META_PERMANENT_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/service-account.json"
          echo "🎬 Starting Pure Vertex T2V Production Run for Track: $TRACK"
          python scripts/run_pipeline.py --format SHORT --track "$TRACK"

      - name: Commit and Push Updated Progress Ledger
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Autonomous Pipeline"
          git add storage/episodic_progress.json storage/published_scripts_ledger.json storage/cost_ledger.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(pipeline): update episodic progress and publication ledgers [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped or failed (state synced safely in GCS)"
          fi
