name: Monthly Cinematic Special Pipeline

on:
  schedule:
    # Runs on the 28th of every month at 13:30 UTC (19:00 IST)
    - cron: '30 13 28 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce_and_schedule_special:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-lohit-deva fontconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Setup Google Service Account
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > service-account.json
          fi

      - name: Run Monthly Special Production
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: devotional-youtube-514907
          GOOGLE_CLOUD_LOCATION: global
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UC7jhh-MuUL4GYndzjouOYSQ
          META_PERMANENT_ACCESS_TOKEN: ${{ secrets.META_PERMANENT_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -f service-account.json ] && [ -s service-account.json ]; then
            export GOOGLE_APPLICATION_CREDENTIALS="${{ github.workspace }}/service-account.json"
          fi
          python scripts/run_pipeline.py --format MONTHLY_SPECIAL --track RAMAYANA
